# Path-traversal / allowed-roots policies (path_scope rules).
#
# path_scope rules are written as action: allow and match when the named
# parameter IS a path inside allowed_roots (via firewall/canonicalize.py's
# canonical_path — real filesystem resolution, never string matching).
# Anything outside those roots simply never matches, and the policy set's
# default_action: deny (below) blocks it — there's no need for a separate
# "deny if outside" rule. See POLICY_GUIDE.md.

default_action: deny

rules:
  - type: path_scope
    id: path-read-file-sandbox
    tool: read_file
    action: allow
    parameter: path
    allowed_roots: ["sandbox"]
    roles: ["analyst", "finance", "admin"]
    description: >
      read_file may only read inside the sandbox/ fixture root, and only
      for analyst-and-above roles — matching rbac-read-file-analysts.
      Without this roles list, an intern (no RBAC grant for read_file)
      could still read any in-scope file: this rule's own ALLOW vote was
      independently sufficient regardless of role, silently bypassing the
      RBAC restriction rather than composing with it (a real bug found
      via testing — see ADR 0012 and LIMITATIONS.md).

  - type: path_scope
    id: path-compose-draft-attachment-sandbox
    tool: compose_draft
    action: allow
    parameter: attachment_path
    allowed_roots: ["sandbox"]
    roles: ["analyst", "finance", "admin"]
    description: >
      A drafted email's attachment must come from inside sandbox/, and
      only for analyst-and-above roles — matching
      rbac-compose-draft-analysts. Without this roles list, a role with
      NO compose_draft RBAC grant at all (e.g. a bare "guest") could
      still compose a draft with an in-scope attachment: this rule's own
      ALLOW vote was independently sufficient regardless of role. This is
      the exact bug class ADR 0012 fixed for path-read-file-sandbox and
      domain-send-email-corp, found there via testing but missed on this
      third rule at the time — found and fixed 2026-09-01 (ADR 0014).
      Deliberately does NOT include "intern": intern's own RBAC vote
      (rbac-compose-draft-intern-needs-approval) is requires_approval,
      and leaving intern out of this rule's roles means it casts no
      competing plain-ALLOW vote for that role, so NEEDS_APPROVAL still
      correctly wins for an intern's in-scope attachment.
