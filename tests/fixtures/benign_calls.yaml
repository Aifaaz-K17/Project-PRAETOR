# Benign-calls corpus for the Phase 3 policy engine (and Phase 7's false-
# positive-rate metric, which this fixture exists to make computable at
# all — CLAUDE.md: "Without this corpus the metric is meaningless").
#
# Every entry here is a legitimate, in-policy call against policies/*.yaml
# and MUST evaluate to Outcome.ALLOW. Deliberately excludes calls that
# would legitimately land on NEEDS_APPROVAL (e.g. an intern's compose_draft,
# or emailing the partner domain) — those are correct-but-not-immediate
# outcomes, not "should always execute", so mixing them in here would make
# the false-positive-rate metric ambiguous about what counts as a miss.
#
# Schema per entry:
#   id             unique slug
#   tool           the tool being called
#   role           the calling principal's role
#   args           the tool's arguments (already in canonical-ish shape —
#                  these are legitimate values, not an encoding torture test)
#   session_history  optional list of tool names treated as already having
#                    happened earlier in this session (needed for
#                    send_email, which policies/sequence.yaml gates behind
#                    a prior compose_draft)

